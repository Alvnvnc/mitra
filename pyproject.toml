[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mitra"
version = "0.1.0"
description = "Always-on, private personal AI with persistent memory and reusable skills. NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=21.0"]
search = ["tavily-python>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.5", "playwright>=1.45"]

[tool.hatch.build.targets.wheel]
packages = ["src/mitra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF", "EXE"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated once at import time by design.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.pytest.ini_options]
testpaths = ["tests"]